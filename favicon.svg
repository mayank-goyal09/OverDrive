<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00aa44"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="14" fill="#070a08"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#00ff66" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Stylized Cyber Supercar Silhouette -->
  <g filter="url(#glow)">
    <!-- Speed streaks -->
    <path d="M 6 36 L 18 36" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M 10 42 L 20 42" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4"/>
    
    <!-- Car Body -->
    <path d="M 16 38 L 24 24 L 38 24 L 54 34 L 58 38 L 56 42 L 18 42 Z" fill="url(#neonGlow)"/>
    <!-- Cockpit glass cutout -->
    <path d="M 28 26 L 36 26 L 46 33 L 26 33 Z" fill="#070a08"/>
    <!-- Wheels -->
    <circle cx="25" cy="42" r="5" fill="#070a08" stroke="#00ff66" stroke-width="2"/>
    <circle cx="47" cy="42" r="5" fill="#070a08" stroke="#00ff66" stroke-width="2"/>
    <!-- Headlight Beam -->
    <path d="M 58 37 L 62 36 L 62 40 Z" fill="#00ff66"/>
    <!-- Rear Wing -->
    <path d="M 15 32 L 20 32 L 18 36 Z" fill="#00ff66"/>
  </g>
</svg>
